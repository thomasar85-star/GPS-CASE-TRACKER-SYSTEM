<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2A66"/>
      <stop offset="100%" stop-color="#051636"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#926B0F"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#0A2A66"/>
  
  <!-- Shield Outer Border -->
  <path d="M 256 60 Q 370 70 410 130 C 410 280 340 390 256 450 C 172 390 102 280 102 130 Q 142 70 256 60 Z" 
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="14" stroke-linejoin="round"/>
        
  <!-- Ghana Stripes Accent Inside Shield -->
  <path d="M 170 180 L 342 180" stroke="#CE1126" stroke-width="8" stroke-linecap="round"/>
  <path d="M 170 196 L 342 196" stroke="#FCD116" stroke-width="8" stroke-linecap="round"/>
  <path d="M 170 212 L 342 212" stroke="#006B3F" stroke-width="8" stroke-linecap="round"/>

  <!-- Ghana Black Star -->
  <polygon points="256,240 268,276 306,276 276,298 288,334 256,312 224,334 236,298 206,276 244,276" fill="#FCD116"/>

  <!-- GPS Text Badge -->
  <text x="256" y="380" font-family="'Cinzel', serif, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">GPS POLICE</text>
  <text x="256" y="408" font-family="'Public Sans', sans-serif" font-size="14" font-weight="700" fill="#C9A227" text-anchor="middle" letter-spacing="3">CASE TRACKER</text>
</svg>
